<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="A quiet place for code, notes, and things worth sharing.">
  <title>SnipPaste — a little space for snippets</title>
  <style>
    :root{color-scheme:dark;--bg:#10110f;--panel:#171916;--panel-2:#1d201c;--line:#2b2e28;--text:#f1f0e9;--muted:#8b8e83;--accent:#d7f36a;--accent-ink:#252a13;--danger:#ff9386;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--serif:'Playfair Display',serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#25291c 0,transparent 43%),var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:0 auto;padding:0 32px}.topbar{height:80px;border-bottom:1px solid #ffffff0d;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;font-weight:700;letter-spacing:-.04em;font-size:18px}.brand-mark{width:29px;height:29px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:17px}.top-note{font:11px var(--mono);color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.hero{padding:62px 0 38px;max-width:720px}.eyebrow{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:22px;height:1px;background:var(--accent)}h1{font:500 clamp(38px,6vw,64px)/1.05 var(--serif);letter-spacing:-.045em;margin:19px 0 14px;max-width:700px}.hero p{color:#a9aca1;font-size:15px;line-height:1.7;margin:0;max-width:520px}.composer{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px #0003}.fields{display:flex;gap:10px;padding:17px 18px;border-bottom:1px solid var(--line);align-items:center}.input{background:transparent;color:var(--text);border:0;outline:0;min-width:0}.title-input{flex:1;font-weight:600}.select{color:var(--muted);font:12px var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:9px 10px;outline:0}.editor-wrap{position:relative}.gutter{position:absolute;top:0;left:0;bottom:0;width:54px;background:#141613;border-right:1px solid #ffffff08;color:#56594f;padding:20px 14px;text-align:right;font:12px/1.75 var(--mono);user-select:none;overflow:hidden}.editor{display:block;width:100%;height:340px;resize:vertical;border:0;outline:0;background:transparent;color:#d9dece;padding:19px 22px 24px 72px;font:13px/1.75 var(--mono);tab-size:2;white-space:pre;overflow:auto}.editor::placeholder{color:#53564d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 17px;border-top:1px solid var(--line)}.hint{font:11px var(--mono);color:var(--muted)}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);color:var(--text);background:var(--panel-2);padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;transition:.18s ease}.btn:hover{border-color:#53584b;transform:translateY(-1px)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.primary:hover{background:#e3ff7f}.btn:disabled{opacity:.55;cursor:wait;transform:none}.message{min-height:20px;padding:0 18px 12px;color:var(--danger);font-size:12px}.result{display:none;margin:16px 0 0;padding:15px 17px;background:#1c2113;border:1px solid #414c25;border-radius:10px}.result.show{display:flex;align-items:center;gap:12px}.result-copy{flex:1;min-width:0}.result-title{font-weight:600;font-size:13px}.result-link{display:block;margin-top:5px;color:var(--accent);font:11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:49px 0 58px}.feature{border-top:1px solid var(--line);padding-top:16px}.feature-icon{color:var(--accent);font:16px var(--mono)}.feature h3{font-size:13px;margin:13px 0 7px}.feature p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}.footer{border-top:1px solid #ffffff0d;padding:21px 0 30px;display:flex;justify-content:space-between;color:#666a60;font:10px var(--mono);letter-spacing:.04em}.view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:52px}.view-title{font:500 clamp(28px,4vw,44px)/1.1 var(--serif);margin:8px 0}.view-meta{color:var(--muted);font:11px var(--mono);margin-top:8px}.view-actions{display:flex;gap:8px}.code-card{margin-top:27px;border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.code-top{height:42px;padding:0 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);color:var(--muted);font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em}.code-body{overflow:auto;padding:22px 24px}.code-body pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d9dece;font:13px/1.8 var(--mono)}.not-found{text-align:center;padding:120px 0}.not-found p{color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,12px);background:#e5f781;color:#202411;padding:11px 15px;border-radius:7px;font-size:12px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:680px){.shell{padding:0 18px}.topbar{height:66px}.top-note{font-size:9px}.hero{padding-top:46px}.fields{flex-wrap:wrap}.title-input{flex-basis:100%;padding-bottom:7px}.editor{height:300px;padding-left:62px}.gutter{width:44px;padding-right:10px}.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.features{grid-template-columns:1fr;gap:20px;padding:35px 0 40px}.view-head{align-items:flex-start;flex-direction:column}.view-actions{width:100%}.view-actions .btn{flex:1}.footer{gap:10px;flex-direction:column}.result.show{align-items:flex-start;flex-wrap:wrap}.result .btn{width:100%}}
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("/assets/ibm-plex-sans.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/assets/ibm-plex-mono.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/assets/ibm-plex-mono-medium.woff2") format("woff2");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }

    :root {
      --sans: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", monospace;
      --body-size: 16px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
    }

    body {
      font-family: var(--sans);
      font-size: var(--body-size);
      line-height: 1.6;
      letter-spacing: 0.005em;
      font-synthesis: none;
    }

    .shell {
      padding-inline: clamp(20px, 4vw, 48px);
    }

    .topbar {
      height: 76px;
    }

    .brand {
      font-size: 19px;
      letter-spacing: -0.035em;
    }

    .top-note {
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(250px, 0.75fr);
      column-gap: clamp(32px, 6vw, 88px);
      align-items: end;
      max-width: none;
      padding: clamp(56px, 7vw, 84px) 0 40px;
    }

    h1,
    .view-title {
      font-family: var(--sans);
      font-weight: 600;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .hero h1 {
      grid-column: 1;
      grid-row: 1;
      max-width: none;
      margin: 0;
      font-size: clamp(50px, 4.8vw, 66px);
      line-height: 0.99;
    }

    .hero p {
      grid-column: 2;
      grid-row: 1;
      align-self: end;
      max-width: 36ch;
      margin: 0 0 5px;
      color: #b6b9ac;
      font-size: clamp(16px, 1.25vw, 18px);
      line-height: 1.7;
    }

    .composer {
      border-radius: 13px;
      box-shadow: 0 20px 64px -42px #000;
    }

    .fields {
      gap: var(--space-3);
      padding: 16px 18px;
    }

    .title-input {
      min-height: 42px;
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .select {
      min-height: 40px;
      padding: 8px 11px;
      font: 13px/1.2 var(--mono);
      letter-spacing: -0.02em;
    }

    .editor {
      height: 320px;
      font: 14px/1.8 var(--mono);
      letter-spacing: 0;
    }

    .gutter {
      font: 12px/1.8 var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      gap: var(--space-4);
      padding: 14px 18px;
    }

    .hint {
      font: 12px/1.5 var(--mono);
    }

    .actions {
      gap: var(--space-2);
    }

    .btn {
      min-height: 42px;
      padding: 10px 15px;
      font-size: 13px;
      letter-spacing: -0.01em;
    }

    .message {
      font-size: 13px;
      line-height: 1.5;
    }

    .features {
      gap: clamp(24px, 4vw, 54px);
      padding: 54px 0 62px;
    }

    .feature {
      padding-top: 14px;
    }

    .feature h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .feature p {
      max-width: 34ch;
      color: #aeb1a5;
      font-size: 14px;
      line-height: 1.65;
    }

    .footer {
      color: #85897d;
      font: 11px/1.5 var(--mono);
      letter-spacing: 0.025em;
    }

    .view-head {
      margin-top: clamp(42px, 7vw, 72px);
    }

    .view-title {
      margin: 0;
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1.04;
    }

    .view-meta {
      color: #b0b3a8;
      font: 12px/1.6 var(--mono);
    }

    .code-top {
      font: 12px/1 var(--mono);
    }

    .code-body pre {
      font: 14px/1.8 var(--mono);
    }

    .result-title {
      font-size: 14px;
    }

    .result-link {
      font: 12px/1.5 var(--mono);
    }

    ::selection {
      color: var(--accent-ink);
      background: var(--accent);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .composer:focus-within {
      border-color: #5a6440;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #141613;
    }

    ::-webkit-scrollbar-thumb {
      border: 2px solid #141613;
      border-radius: 8px;
      background: #41463a;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #69734b;
    }

    @media (max-width: 1080px) {
      .hero {
        display: block;
        padding-top: 58px;
      }

      .hero h1 {
        max-width: none;
        font-size: clamp(48px, 6.2vw, 66px);
      }

      .hero p {
        max-width: 48ch;
        margin-top: 20px;
      }
    }

    @media (max-width: 680px) {
      .shell {
        padding-inline: 20px;
      }

      .topbar {
        height: 68px;
      }

      .top-note {
        font-size: 10px;
      }

      .hero {
        padding: 46px 0 30px;
      }

      .hero h1 {
        max-width: none;
        font-size: clamp(42px, 11vw, 56px);
        line-height: 1;
      }

      .hero h1 br {
        display: none;
      }

      .hero p {
        margin-top: 16px;
        font-size: 16px;
      }

      .fields {
        gap: 8px;
        padding: 13px 14px;
      }

      .title-input {
        flex-basis: 100%;
      }

      .select {
        flex: 1;
        min-width: 0;
        font-size: 12px;
      }

      .editor {
        height: 300px;
        padding-left: 62px;
        font-size: 13px;
      }

      .gutter {
        width: 44px;
        padding-right: 10px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }

      .features {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 38px 0 44px;
      }

      .feature p {
        max-width: 42ch;
      }

      .view-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .view-title {
        font-size: clamp(34px, 9vw, 48px);
      }

      .view-actions {
        width: 100%;
      }

      .view-actions .btn {
        flex: 1;
      }

      .footer {
        gap: 10px;
        flex-direction: column;
      }

      .result.show {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .result .btn {
        width: 100%;
      }
    }

    @media (max-width: 460px) {
      .top-note {
        display: none;
      }

      .shell {
        padding-inline: 16px;
      }

      .hero h1 {
        font-size: clamp(40px, 11.5vw, 50px);
      }

      .view-meta {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <!-- PASTE_DATA -->
  <div class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="brand-mark">s.</span><span>snippaste</span></a><span class="top-note">small things, shared simply</span></header>
    <main id="app"></main>
    <footer class="footer"><span>MADE FOR THE THINGS YOU WANT TO KEEP</span><span>OPEN SOURCE · BUILT WITH RUST</span></footer>
  </div>
  <div class="toast" id="toast">Copied to clipboard</div>
  <script>
    const app=document.getElementById('app');
    const languages=['Plain text','Rust','JavaScript','TypeScript','Python','Go','Bash','JSON','HTML','CSS','SQL','Markdown','YAML','TOML','C','C++','Java','Ruby','PHP','Swift','Kotlin'];
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function selectOptions(selected='Plain text'){return languages.map(x=>`<option ${x===selected?'selected':''}>${escapeHtml(x)}</option>`).join('')}
    function toast(message='Copied to clipboard'){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
    async function copy(value){try{await navigator.clipboard.writeText(value);toast()}catch{toast('Clipboard access unavailable')}}
    function renderHome(){app.innerHTML=`<section class="hero"><h1>Leave the messy tabs<br>behind.</h1><p>Drop in a thought, a piece of code, or a note worth sharing. Get a link you can pass along in a second.</p></section>
      <form class="composer" id="paste-form"><div class="fields"><input class="input title-input" id="title" maxlength="100" placeholder="Give this paste a name…" aria-label="Paste title"><select class="select" id="language" aria-label="Language">${selectOptions()}</select><select class="select" id="expiration" aria-label="Expiration"><option value="never">Never expires</option><option value="1d">1 day</option><option value="7d">7 days</option><option value="30d">30 days</option><option value="1y">1 year</option></select></div><div class="editor-wrap"><div class="gutter" id="gutter">1</div><textarea class="editor" id="content" placeholder="Paste something lovely…" spellcheck="false" aria-label="Paste content"></textarea></div><div class="toolbar"><span class="hint" id="count">0 characters · 512 KiB max</span><div class="actions"><button class="btn" type="button" id="clear">Clear</button><button class="btn primary" type="submit" id="submit">Create paste <span aria-hidden="true">↗</span></button></div></div><div class="message" id="message" role="status"></div></form><div class="result" id="result"><div class="result-copy"><div class="result-title">Your paste is ready</div><a class="result-link" id="result-url"></a></div><button class="btn" type="button" id="copy-link">Copy link</button></div>
      <section class="features"><article class="feature"><h3>Just the useful bits</h3><p>Share code, notes, logs, or anything text-shaped. No account or ceremony required.</p></article><article class="feature"><h3>Here for as long as you need</h3><p>Keep a paste around, or let it expire after a day, a week, a month, or a year.</p></article><article class="feature"><h3>Small by design</h3><p>Fast Rust server. Plain text stays plain text, with a raw link ready to use.</p></article></section>`;
      const content=document.getElementById('content'),gutter=document.getElementById('gutter');content.addEventListener('input',()=>{document.getElementById('count').textContent=`${content.value.length.toLocaleString()} characters · 512 KiB max`;gutter.textContent=Array.from({length:Math.max(1,content.value.split('\n').length)},(_,i)=>i+1).join('\n')});content.addEventListener('scroll',()=>{gutter.scrollTop=content.scrollTop});document.getElementById('clear').onclick=()=>{content.value='';content.dispatchEvent(new Event('input'));document.getElementById('title').value='';document.getElementById('message').textContent='';content.focus()};
      document.getElementById('paste-form').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;button.textContent='Saving…';message.textContent='';try{const response=await fetch('/api/pastes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,content:content.value,language:document.getElementById('language').value,expiration:document.getElementById('expiration').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not create paste.');const url=new URL(data.url,location.href).href;const link=document.getElementById('result-url');link.href=url;link.textContent=url;document.getElementById('result').classList.add('show');document.getElementById('copy-link').onclick=()=>copy(url);document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(err){message.textContent=err.message}finally{button.disabled=false;button.innerHTML='Create paste <span aria-hidden="true">↗</span>'}};
    }
    function renderPaste(p){document.title=`${p.title} — SnipPaste`;const created=new Date(p.created_at).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});app.innerHTML=`<section class="view-head"><div><h1 class="view-title">${escapeHtml(p.title)}</h1><div class="view-meta">${escapeHtml(p.language)} &nbsp;·&nbsp; ${escapeHtml(created)}${p.expires_at?` &nbsp;·&nbsp; expires ${escapeHtml(new Date(p.expires_at).toLocaleDateString())}`:''}</div></div><div class="view-actions"><button class="btn" id="raw">View raw ↗</button><button class="btn primary" id="copy-content">Copy text</button></div></section><section class="code-card"><div class="code-top"><span>${escapeHtml(p.language)}</span><span>${p.content.length.toLocaleString()} characters</span></div><div class="code-body"><pre id="paste-content"></pre></div></section><p class="hint" style="margin:15px 2px"><a href="/" style="color:var(--accent);text-decoration:none">← Make your own paste</a></p>`;document.getElementById('paste-content').textContent=p.content;document.getElementById('raw').onclick=()=>location.href=`/api/pastes/${encodeURIComponent(p.id)}/raw`;document.getElementById('copy-content').onclick=()=>copy(p.content)}
    if(window.PASTE_DATA){renderPaste(window.PASTE_DATA)}else{renderHome()}
  </script>
</body>
</html>
