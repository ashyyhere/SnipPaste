<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="This SnipPaste page could not be found.">
  <title>Page not found — SnipPaste</title>
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("/assets/ibm-plex-sans.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/assets/ibm-plex-mono.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      background: #10110f;
      color: #f1f0e9;
      --muted: #a2a596;
      --line: #2b2e28;
      --accent: #d7f36a;
      --accent-ink: #252a13;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 68% 5%, #25291c 0, transparent 42%), #10110f;
    }
    .shell { width: min(100% - 48px, 1120px); margin: 0 auto; }
    .topbar {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ffffff0d;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.04em;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 16px;
    }
    .top-note, .code {
      color: var(--muted);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    main {
      display: grid;
      min-height: min(690px, calc(100vh - 140px));
      place-content: center;
      justify-items: start;
      padding: 76px 0 88px;
    }
    .error-code {
      margin: 0 0 16px;
      color: var(--accent);
      font: 12px "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .14em;
    }
    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(44px, 7vw, 76px);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: .99;
    }
    .copy {
      max-width: 440px;
      margin: 22px 0 30px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 0 17px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }
    .home-link:hover { transform: translateY(-2px); background: #e4ff85; }
    .home-link:focus-visible, .brand:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 0 28px;
      border-top: 1px solid #ffffff0d;
      color: #777a70;
      font: 10px "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .04em;
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 36px, 1120px); }
      .topbar { height: 68px; }
      .top-note { font-size: 9px; }
      main { min-height: calc(100svh - 130px); padding: 64px 0; }
      .copy { max-width: 34ch; }
      .footer { flex-direction: column; gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="SnipPaste home"><span class="brand-mark">s.</span><span>snippaste</span></a>
      <span class="top-note">small things, shared simply</span>
    </header>
    <main>
      <p class="error-code">404</p>
      <h1>This page wandered off.</h1>
      <p class="copy">That link doesn’t lead to a paste we can find. It may be mistyped, expired, or never existed.</p>
      <a class="home-link" href="/">Return to home <span aria-hidden="true">↗</span></a>
    </main>
    <footer class="footer"><span>MADE FOR THE THINGS YOU WANT TO KEEP</span><span>OPEN SOURCE · BUILT WITH RUST</span></footer>
  </div>
</body>
</html>
